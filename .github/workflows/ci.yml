name: ClassPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend API & Real-time Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Syntax & Lint Verification
        run: node -c src/index.js src/db/index.js src/services/qrTokenService.js

      - name: Run Backend Tests
        run: npm test

  web-ci:
    name: Web Frontend (Next.js + MUI) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://classpulse-api-09dw.onrender.com

  mobile-ci:
    name: Mobile App (Flutter Android APK Builder)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK & NDK 27
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

      - name: Build Standalone Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://classpulse-api-09dw.onrender.com

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpulse-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
