name: ClassPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend API & Real-time Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Lint Verification
        run: node -c src/index.js src/db/index.js src/services/qrTokenService.js

      - name: Run Backend Tests
        run: npm test

  web-ci:
    name: Web Frontend (Next.js + MUI) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  mobile-ci:
    name: Mobile App (Flutter Android) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

      - name: Build Testable Android APK
        run: flutter build apk --debug
